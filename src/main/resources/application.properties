spring.application.name=medlink
server.port=${PORT:8080}

# ---------- Banco de dados Oracle (FIAP) ----------
# Defina as variáveis de ambiente DB_USER e DB_PASSWORD (seu RM e senha).
# Nunca coloque a senha direto aqui: o repositório do GitHub é público para a avaliação.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:rmXXXXX}
spring.datasource.password=${DB_PASSWORD:senha}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# As tabelas do Oracle são criadas pelos scripts da pasta /sql
spring.sql.init.mode=never

# ---------- JSON ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------- Medlink ----------
# Intervalo da verificação de ofertas expiradas (ms)
medlink.expiracao.intervalo-ms=60000

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
